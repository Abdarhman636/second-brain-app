<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e6e6e4" />
    <meta name="description" content="رسوخ — احفظ ما تتعلمه، ونعيده إليك في الوقت المناسب حتى يصبح معرفة راسخة." />
    <title>رسوخ</title>

    <!-- Apply the saved theme before first paint (light is the default). -->
    <script>
      try {
        if (localStorage.getItem('rusookh-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#0f0f0f');
        }
      } catch {}
    </script>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500&family=Alexandria:wght@500;600;700&display=swap"
    />
  </head>

  <body>
    <div id="root"></div>
    <noscript>يحتاج هذا التطبيق إلى تفعيل JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
