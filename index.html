<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#262626" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="رسوخ — احفظ ما تتعلمه، ونعيده إليك في الوقت المناسب حتى يصبح معرفة راسخة."
    />
    <title>رسوخ</title>

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="css/main.css" />

    <script type="module" src="js/main.js"></script>
  </head>

  <body data-page="today">
    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="#today" aria-label="رسوخ — مراجعة اليوم">
          <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <rect width="32" height="32" rx="7" fill="currentColor" />
            <path
              d="M23 10.5h-6M23 16h-9.5M23 21.5H9"
              stroke="#f8f8f8"
              stroke-width="2.4"
              stroke-linecap="round"
            />
          </svg>
          <span class="brand__name">رسوخ</span>
        </a>

        <nav class="app-nav" id="app-nav" aria-label="التنقل الرئيسي"></nav>

        <div class="app-header__actions" id="app-header-actions"></div>
      </header>

      <main class="app-main" id="app-main" tabindex="-1">
        <p class="page-loading">جارٍ تجهيز مراجعتك…</p>
      </main>
    </div>

    <dialog class="modal" id="app-modal" aria-labelledby="modal-title"></dialog>
    <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>

    <noscript>
      <p class="page-loading">يحتاج هذا التطبيق إلى تفعيل JavaScript.</p>
    </noscript>
  </body>
</html>
